<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIXO — Sistema de Gestão de Oficinas</title>

  <link rel="icon" type="image/png" href="../assets/images/icon.png" >

  <link rel="stylesheet" href="../global/css/global.css">
  <link rel="stylesheet" href="../global/css/toast.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-page">

    <section class="side-left" aria-label="Apresentação do sistema">
      <div class="grid-overlay"></div>
      <div class="top-accent"></div>

      <div class="left-content">
        <div class="logo-wrap">
          <img src="../assets/images/logo.png" alt="EIXO" class="logo-img">
        </div>

        <h2 class="left-title">Sistema de Gestão</h2>
        <p class="left-desc">
          Gerencie clientes, veículos, ordens de serviço, estoque e fluxo de caixa em um só lugar.
        </p>

        <div class="feature-list">
          <div class="feature-item"><span class="feature-dot"></span><span>Clientes &amp; Veículos</span></div>
          <div class="feature-item"><span class="feature-dot"></span><span>Ordens de Serviço</span></div>
          <div class="feature-item"><span class="feature-dot"></span><span>Estoque</span></div>
          <div class="feature-item"><span class="feature-dot"></span><span>Fluxo de Caixa</span></div>
        </div>
      </div>
    </section>

    <section class="side-right">
      <form class="form-wrap" id="login-form" novalidate>

        <div class="form-header">
          <h1 class="welcome-title">Bem-vindo</h1>
          <p class="welcome-sub">Faça login para continuar</p>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field-group senha-group">
          <label for="senha">Senha</label>

          <div class="senha-wrap">
            <input
              type="password"
              id="senha"
              name="senha"
              class="senha-field"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-senha"
              id="toggle-senha"
              aria-label="Mostrar senha"
              title="Mostrar senha"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot-wrap">
          <a href="#" class="forgot-link">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-entrar" id="btn-entrar">
          <span class="btn-text">Entrar no Sistema</span>
        </button>

        <p class="footer-note">EIXO © 2026 — Sistema de Gestão de Oficinas</p>

      </form>
    </section>

  </main>

  <script src="../global/js/config.js"></script>
  <script src="../global/js/api.js"></script>
  <script src="../global/js/session.js"></script>
  <script src="../global/js/toast.js"></script>
  <script src="login.js"></script>
</body>
</html>
